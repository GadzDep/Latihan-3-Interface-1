<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan-4</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
</head>
<body>

  <div class="card">
    <div class="header">
        <div class="status">Completed</div>
        <i class="hgi hgi-stroke hgi-more-vertical more-icon"></i>
    </div>
    <div class="content">
      <img src="https://images.seeklogo.com/logo-png/27/1/twitch-logo-png_seeklogo-274042.png" alt="" class="logo">
      <h2>Urban Dreams</h2>
      <p class="subtitle">Live Gaming Spectacle Unveiled</p>

      <div class="stats">
        <div class="stat">
          <h3>50.7%</h3>
          <p>Traffic Up</p>
        </div>
        <div class="stat">
          <h3>20.1k</h3>
          <p>New Fans</p>
        </div>
        <div class="stat">
          <h3>$100k</h3>
          <p>Donated</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
